site_name: shipyard-docs
site_description: 용접 시스템 통신 프로토콜 통합 COMM
repo_name: shh444/shipyard-docs
repo_url: https://github.com/shh444/shipyard-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 홈: index.md
  - 통신 개요: protocol/overview.md
  - 레지스터 맵 요약: protocol/register-map-summary.md
  - 로봇 → 팬던트: protocol/robot-to-pendant.md
  - 팬던트 → 로봇: protocol/pendant-to-robot.md
  - 로봇 ↔ 용접기: protocol/welder-interface.md
  - 용접 조건: protocol/welding-conditions.md
  - 비트필드/열거형: protocol/bitfields-enums.md
  - 시퀀스: protocol/sequences.md
  - 에러/알람: protocol/errors-alarms.md
  - UR 컨트롤러 부록: protocol/ur-controller.md
  - 소스 정합표: protocol/source-reconciliation.md
  - 참고 자료: protocol/references.md
